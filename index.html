<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dfe6f4">
<title>Vocabulary Quest: The Mystery of the Broken Laptop</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<main class="book">
  <header class="top">
    <p class="brand">Vocabulary Quest</p>
    <p class="xp" id="xp"></p>
    <h1>The Mystery of the Broken Laptop</h1>
  </header>

  <figure class="scene">
    <canvas id="world" width="1280" height="560" role="img" aria-label="Story scene"></canvas>
    <figcaption id="location"></figcaption>
  </figure>

  <nav aria-label="Chapters"><ol id="levels"></ol></nav>
  <div class="progress-row">
    <progress id="progress" max="25" aria-label="Questions answered"></progress>
    <span id="completed">00/25</span>
  </div>

  <section id="game">
    <p id="counter"></p>
    <h2 id="chapter"></h2>
    <p id="story"></p>

    <div class="sheet">
      <form id="form">
        <label id="sentence" class="sentence" for="answer"><span id="question"></span><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="in English"><span id="question-after"></span></label>
      </form>
      <p id="feedback" role="status" aria-live="polite"></p>
    </div>

    <div class="actions">
      <button id="check" form="form">Check answer</button>
      <button id="next" hidden>Continue the story</button>
      <button id="hint" type="button" class="quiet">German hint</button>
      <button id="reveal" type="button" class="quiet">Show answer</button>
    </div>
    <p class="rules">10 XP if you get it on the first try, 5 XP with help.</p>
  </section>

  <section id="finish" hidden>
    <h2>Mystery solved!</h2>
    <p>Small words, a big act of courage. You helped Emma find her voice.</p>
    <p id="result"></p>
  </section>

  <footer class="foot">
    <button id="reset" type="button" class="quiet">Start again</button>
    <button id="palette" type="button" class="quiet">Switch to chalkboard</button>
    <span>Your progress is saved on this device.</span>
  </footer>
</main>
<script src="src/chapters.js"></script><script src="src/scene.js"></script><script src="src/game.js"></script>
</body>
</html>
